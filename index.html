<html lang="en">

<title>Matt Innerd | MI Resilience</title>

:root{
    --navy:#0F172A;
    --blue:#2563EB;
    --light:#F8FAFC;
    --text:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;

    color:white;
    padding:70px 20px;
}

.hero-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:60px;
    flex-wrap:wrap;
}

.hero-left{
    flex:1;
    min-width:320px;
}

.hero-right{
    flex:0 0 auto;
}

.logo{
    width:220px;
    margin-bottom:30px;
}

.headshot{

    height:300px;
    border-radius:50%;

    border:6px solid rgba(255,255,255,0.2);
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    font-size:1.2rem;
    margin-bottom:25px;
}

.hero p{
    max-width:700px;
    font-size:1.1rem;
}

.buttons{
    margin-top:35px;
}
